name: powerchute-exporter
arch: ${GOARCH}
platform: linux
version: ${VERSION}
release: '1'
maintainer: ${PACKAGE_MAINTAINER}
description: Prometheus exporter for PowerChute Serial Shutdown Energy Reporting and Data Log.
section: net
priority: optional
contents:
  - src: dist/linux-${GOARCH}/powerchute-exporter
    dst: /usr/bin/powerchute-exporter
    expand: true
    file_info:
      mode: 0755
  - src: packaging/linux/powerchute-exporter.service
    dst: /usr/lib/systemd/system/powerchute-exporter.service
    file_info:
      mode: 0644
  - dst: /etc/powerchute-exporter
    type: dir
    file_info:
      mode: 0750
      owner: root
      group: powerchute-exporter
  - src: configs/config.example.yaml
    dst: /etc/powerchute-exporter/config.yaml
    type: config|noreplace
    file_info:
      mode: 0640
      owner: root
      group: powerchute-exporter
  - src: packaging/linux/environment
    dst: /etc/powerchute-exporter/environment
    type: config|noreplace
    file_info:
      mode: 0640
      owner: root
      group: powerchute-exporter
  - src: README.md
    dst: /usr/share/doc/powerchute-exporter/README.md
    file_info:
      mode: 0644
scripts:
  preinstall: packaging/linux/preinstall.sh
  postinstall: packaging/linux/postinstall.sh
  preremove: packaging/linux/preremove.sh
  postremove: packaging/linux/postremove.sh
overrides:
  deb:
    depends: [ca-certificates, passwd, systemd]
  rpm:
    depends: [ca-certificates, shadow-utils, systemd]
